[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zoemini"
version = "0.4.2"
description = "Printing on Canon Zoemini 2 / Ivy 2 over Bluetooth (RFCOMM), without the official app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
emulator = ["dbus-fast>=2"]

[project.scripts]
zoemini = "zoemini.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
